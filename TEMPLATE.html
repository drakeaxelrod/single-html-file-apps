<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" />
    <title>Single HTML File App Template</title>
    <meta name="description" content="A minimal single-file web app built with React and Tailwind." />
    <meta name="author" content="Drake Axelrod" />
    <meta name="keywords" content="HTML, CSS, JavaScript, React, Tailwind, Single File App" />
    <meta name="robots" content="index, follow" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,{base64 encoded svg goes here}" />

    <!--
    ==================================================
    Libraries (CDNs)
    ==================================================
    -->
    <!-- Font performance improvements -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- DaisyUI Themes -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <!-- React  -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" defer></script>
    <!-- React DOM -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" defer></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/inter-ui@3.19.3/inter.css" />
    <!-- Lilex Nerd Font -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/lilex-nerd-font.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin />
  </head>
  <body>
    <noscript><strong>JavaScript is required to run this app.</strong></noscript>
    <div id="root"></div>
    <script type="text/babel">
      // React component goes here
      const App = () => {
        return (
          <div className="flex items-center justify-center h-screen bg-gray-100">
            <h1 className="text-4xl font-bold text-gray-800">Hello, World!</h1>
          </div>
        )
      }
    </script>

    <!-- ReactDOM Render Application -->
    <script type="text/babel">
      ReactDOM.render(<App />, document.getElementById("root"))
    </script>
  </body>
</html>
